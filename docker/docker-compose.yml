services:
  postgres:
    image: postgres:16-alpine
    container_name: spok-postgres
    environment:
      POSTGRES_USER: spok
      POSTGRES_PASSWORD: spok
      POSTGRES_DB: spok
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spok"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: spok-api
    environment:
      DATABASE_URL: postgresql://spok:spok@postgres:5432/spok?schema=public
      API_PORT: "3001"
      API_HOST: "0.0.0.0"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-me-refresh-in-production}"
      CORS_ORIGIN: "http://localhost:5173"
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: spok-web
    environment:
      VITE_API_URL: "http://localhost:3001"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
