# nginx de l'image Web (Dockerfile.web) : sert le build Vite statique, repli SPA sur index.html, cache des assets.
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # llms.txt - fiche de découverte pour les assistants IA (serveur MCP) : UTF-8 explicite, non mis en cache
        location = /llms.txt {
            charset utf-8;
            add_header Cache-Control "no-cache";
        }

        # index.html - never cache (so new deploys are picked up immediately)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # SPA routing - always serve index.html for any route
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }

        # Service worker script - never cache (must be re-checked on every deploy,
        # unlike hashed static assets below). Bug fixed 2026-08-24: this used to fall
        # through to the immutable 1y rule since it also matches *.js
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Vite build output (hashed filenames) - safe to cache forever.
        # ^~ stops nginx from also testing the regex location below.
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Unhashed static files from apps/web/public (icons, favicon) - revalidate
        # on every load (ETag). Bug fixed 2026-10-10: they used to get the immutable
        # 1y rule, so phones kept the old PWA icon even after reinstalling.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            add_header Cache-Control "no-cache";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
