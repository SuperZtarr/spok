worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # index.html - never cache (so new deploys are picked up immediately)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # SPA routing - always serve index.html for any route
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }

        # Service worker script - never cache (must be re-checked on every deploy,
        # unlike hashed static assets below). Bug fixed 2026-08-24: this used to fall
        # through to the immutable 1y rule since it also matches *.js
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache static assets (hashed filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
